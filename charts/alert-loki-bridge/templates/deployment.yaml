{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-loki-bridge
  labels:
    app: alert-loki-bridge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: alert-loki-bridge
  template:
    metadata:
      labels:
        app: alert-loki-bridge
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: alert-loki-bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: JITHUB_LOKI_PUSH_URL
              value: {{ .Values.lokiPushUrl | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 3
{{- end }}
